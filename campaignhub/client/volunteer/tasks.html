<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks | CampaignHub</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <div>
          <p class="crumb">Volunteer</p>
          <h1>My Tasks</h1>
        </div>
        <div class="user-chip">
          <div class="meta"><strong id="who"></strong><small id="whoRole"></small></div>
          <div class="avatar" id="avatar"></div>
        </div>
      </header>

      <div class="content">
        <section class="card status-card hidden" id="blocked"></section>

        <div id="area" class="hidden">
          <section class="stats">
            <div class="stat">
              <div class="ico indigo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
              <div><div class="num" id="sOpen">0</div><div class="lbl">Tasks to do</div></div>
            </div>
            <div class="stat">
              <div class="ico amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
              <div><div class="num" id="sWaiting">0</div><div class="lbl">Waiting for review</div></div>
            </div>
            <div class="stat">
              <div class="ico green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg></div>
              <div><div class="num" id="sDone">0</div><div class="lbl">Verified by manager</div></div>
            </div>
            <div class="stat">
              <div class="ico cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
              <div><div class="num" id="sRating">—</div><div class="lbl">Your average rating</div></div>
            </div>
          </section>

          <section class="card">
            <div class="card-head">
              <div>
                <h2>Tasks assigned to you</h2>
                <p>Start a task, do the work, then submit proof (photos, PDF or links). The manager verifies it and marks it completed.</p>
              </div>
            </div>
            <div class="toolbar"><div class="tabs scroll" id="tabs"></div></div>
            <div class="camp-grid" id="grid"></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/volunteer-tasks.js"></script>
</body>
</html>
