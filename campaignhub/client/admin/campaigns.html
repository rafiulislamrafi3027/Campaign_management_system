<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaign Approval | CampaignHub</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <div>
          <p class="crumb">Admin Panel</p>
          <h1>Campaign Approval</h1>
        </div>
        <div class="user-chip">
          <div class="meta"><strong id="who"></strong><small id="whoRole"></small></div>
          <div class="avatar" id="avatar"></div>
        </div>
      </header>

      <div class="content">
        <section class="stats">
          <div class="stat">
            <div class="ico amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
            <div><div class="num" id="sSubmitted">0</div><div class="lbl">Waiting for review</div></div>
          </div>
          <div class="stat">
            <div class="ico cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
            <div><div class="num" id="sActive">0</div><div class="lbl">Active campaigns</div></div>
          </div>
          <div class="stat">
            <div class="ico green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></div>
            <div><div class="num" id="sBudget">৳ 0</div><div class="lbl">Approved budget</div></div>
          </div>
          <div class="stat">
            <div class="ico red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg></div>
            <div><div class="num" id="sRejected">0</div><div class="lbl">Rejected</div></div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <div>
              <h2>Campaigns</h2>
              <p>Only approved campaigns can go live for volunteers. Drafts stay private to managers.</p>
            </div>
          </div>
          <div class="toolbar">
            <div class="tabs scroll" id="tabs"></div>
          </div>
          <div class="camp-grid" id="grid"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin-campaigns.js"></script>
</body>
</html>
