<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Log | CampaignHub</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <div>
          <p class="crumb">Admin Panel</p>
          <h1>Audit Log</h1>
        </div>
        <div class="user-chip">
          <div class="meta"><strong id="who"></strong><small id="whoRole"></small></div>
          <div class="avatar" id="avatar"></div>
        </div>
      </header>

      <div class="content">
        <section class="card">
          <div class="card-head">
            <div>
              <h2>Who did what, and when</h2>
              <p>Read-only record of important actions and every AI request. Entries can never be edited or deleted.</p>
            </div>
            <button class="btn btn-light" id="csvBtn"></button>
          </div>
          <div class="audit-filters">
            <div class="tabs scroll" id="cats"></div>
            <div class="audit-inputs">
              <input type="search" id="q" placeholder="Search name, campaign, details..." />
              <label>From <input type="date" id="from" /></label>
              <label>To <input type="date" id="to" /></label>
            </div>
          </div>
          <div id="list" class="audit-list"></div>
          <div style="text-align:center;margin-top:14px"><button class="btn btn-light hidden" id="more">Load more</button></div>
        </section>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin-audit.js"></script>
</body>
</html>
